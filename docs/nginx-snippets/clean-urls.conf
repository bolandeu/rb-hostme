# Managed by hostme (`hostme <domain> config --nginx-snippet ...`).
# Чистые URL для статических генераторов (аналог apache-htaccess.conf):
# /page.html -> редирект на /page, /page/ -> /page, /page -> отдаётся page.html.
# Кастомный 404. Всё остальное (gzip, кэш статики, security-заголовки) уже
# даёт сам Webinoly по умолчанию — не дублируем, см. docs/nginx-snippets/README.md.
#
# ВАЖНО для PHP-сайтов (index index.php ...): у Webinoly location / делает
# try_files $uri $uri/ /index.php$is_args$args — промах уходит в PHP-location,
# и реальный 404 рождается уже ТАМ (try_files $uri =404 на несуществующий
# /index.php), когда $uri уже переписан в /index.php. НЕ помогает `set $x $uri`
# на server-уровне заранее — rewrite-фаза прогоняется заново на каждый
# внутренний redirect, так что $x тоже успевает стать /index.php к моменту,
# когда его читают. Единственное, что гарантированно не меняется никогда —
# $request_uri; вырезаем из него путь без query string ЗДЕСЬ же, на
# server-уровне (идемпотентно — сколько раз rewrite-фаза ни прогонится,
# $request_uri тот же, результат тот же).
#
# ВАЖНО #2: этот if НЕЛЬЗЯ переносить внутрь location @hostme_try_html —
# `if` в одном location вместе с `try_files` там просто НЕ срабатывает
# (try_files молча проваливается в fallback, даже если файл реально
# существует) — классическая "if is evil" ловушка nginx, поймано вживую
# 2026-09-09 (несколько часов отладки на test.bolandau.ru).
if ($request_uri ~ ^(/[^?]*)) {
    set $hostme_path $1;
}

# /index.html -> /
if ($request_uri ~ ^/index\.html(\?.*)?$) {
    return 301 /$1;
}

# /page.html -> /page (кроме /index.html, уже обработан выше)
if ($request_uri ~ ^/(.+)\.html(\?.*)?$) {
    return 301 /$1$2;
}

# ВАЖНО, известное ограничение (поймано вживую 2026-09-09 на test.bolandau.ru,
# см. docs/nginx-snippets/README.md): правила "/page/ -> /page" тут нет —
# если рядом с page.html существует директория page/ (частый случай у
# генераторов с пагинацией/подстраницами), это правило зацикливается с
# нативным поведением nginx "директория без слэша -> редирект добавить слэш"
# (try_files $uri $uri/ у Webinoly). Не решается без правки location /
# самого Webinoly (нельзя, см. AGENTS.md), поэтому не реализовано.

# Webinoly уже отдаёт существующие файлы/директории через location / напрямую
# (try_files $uri $uri/ =404) — сюда попадаем только когда такого файла нет.
# Два уровня намеренно РАЗДЕЛЕНЫ (не один try_files с несколькими целями):
# первый — без форсирования кода, чтобы успешный <uri>.html матч остался 200;
# второй — только для настоящего "ничего не найдено", там уже форсируем 404
# с кастомным контентом. Объединение в один try_files форсировало 404 даже
# на успешные чистые URL (реальный баг, пойман вживую 2026-09-09).
# ВАЖНО #3, известное ограничение (поймано вживую 2026-09-09): корректный
# статус 404 при отдаче кастомной /404.html средствами error_page не удалось
# добиться — nginx не запускает error_page повторно для ошибки, возникшей
# ВНУТРИ уже активной обработки error_page (это защита от бесконечных циклов,
# а не баг конфига; проверено несколькими способами: именованные location,
# промежуточный код 410 с форс-обратно в 404 — везде клиент видел либо
# 410 буквально, либо 200 вместо 404). Итог: /404.html отдаётся клиенту с
# правильным КОНТЕНТОМ, но статусом 200, а не 404 — SEO-некорректно
# (поисковик формально не поймёт, что страницы нет), но для человека
# выглядит правильно. Если статус 404 принципиален — не использовать этот
# сниппет как есть, разбираться отдельно (возможно, только через правку
# самого location / у Webinoly, что запрещено, см. AGENTS.md).
error_page 404 = @hostme_try_html;
location @hostme_try_html {
    internal;
    try_files $hostme_path.html /404.html =404;
}
