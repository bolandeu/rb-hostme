# Managed by hostme (`hostme <domain> config --nginx-snippet ...`).
# Профиль под "Static Landing Generator" (~/Projects/sitegenerator).
# Чистые URL (аналог docs/apache-htaccess.conf оттуда же):
# /page.html -> редирект на /page, /page/ -> /page, /page -> отдаётся page.html.
# Кастомный 404. Всё остальное (gzip, кэш статики, security-заголовки) уже
# даёт сам Webinoly по умолчанию — не дублируем, см. docs/nginx-snippets/README.md.
#
# ВАЖНО для PHP-сайтов (index index.php ...): у Webinoly location / делает
# try_files $uri $uri/ /index.php$is_args$args — промах уходит в PHP-location,
# и реальный 404 рождается уже ТАМ (try_files $uri =404 на несуществующий
# /index.php), когда $uri уже переписан в /index.php. НЕ помогает `set $x $uri`
# на server-уровне заранее — rewrite-фаза прогоняется заново на каждый
# внутренний redirect, так что $x тоже успевает стать /index.php к моменту,
# когда его читают. Единственное, что гарантированно не меняется никогда —
# $request_uri; вырезаем из него путь без query string ЗДЕСЬ же, на
# server-уровне (идемпотентно — сколько раз rewrite-фаза ни прогонится,
# $request_uri тот же, результат тот же).
#
# ВАЖНО #2: этот if НЕЛЬЗЯ переносить внутрь location @hostme_try_html —
# `if` в одном location вместе с `try_files` там просто НЕ срабатывает
# (try_files молча проваливается в fallback, даже если файл реально
# существует) — классическая "if is evil" ловушка nginx, поймано вживую
# 2026-09-09 (несколько часов отладки на test.bolandau.ru).
if ($request_uri ~ ^(/[^?]*)) {
    set $hostme_path $1;
}

# /index.html -> /
if ($request_uri ~ ^/index\.html(\?.*)?$) {
    return 301 /$1;
}

# /page.html -> /page (кроме /index.html, уже обработан выше)
if ($request_uri ~ ^/(.+)\.html(\?.*)?$) {
    return 301 /$1$2;
}

# /page/ -> /page (кроме корня). Раньше здесь зацикливалось с нативным
# поведением nginx "директория без слэша -> добавить слэш" (try_files
# $uri $uri/ у Webinoly), когда рядом с page.html есть одноимённая директория
# page/ (частый случай у генераторов — catalog.html + catalog/, где в
# catalog/index.php лежит просто заглушка-редирект на /, а не контент).
# Пофикшено проактивной проверкой -f ниже: она перехватывает /page ДО того,
# как Webinoly вообще успевает попробовать матчить директорию, так что цикл
# больше не запускается. Поймано и исправлено вживую 2026-09-09 на
# test.bolandau.ru (catalog/, blog/ у этого проекта).
if ($request_uri ~ ^/(.+)/(\?.*)?$) {
    return 301 /$1$2;
}

# ПРОАКТИВНАЯ проверка (на rewrite-фазе, ДО location-матчинга Webinoly):
# если для чистого URL есть <path>.html — сразу переписываем на него. Без
# этого для /catalog Webinoly матчит директорию catalog/ раньше файла
# (try_files $uri $uri/ ...) и выполняет её index.php-заглушку (обычно
# просто редирект на / — "не отдавать листинг"), а не отдаёт catalog.html.
if (-f $document_root$hostme_path.html) {
    rewrite ^ $hostme_path.html last;
}

# Настоящий 404 (SEO: код ответа обязателен, не просто похожая страница).
# Проактивная проверка выше уже разобралась со ВСЕМИ случаями, когда <path>.html
# реально существует — сюда попадаем ТОЛЬКО когда его действительно нет.
# Поэтому error_page здесь решает ровно одну задачу (не две, как в прошлой
# версии) — это и есть стандартный документированный паттерн nginx для
# кастомных error-страниц (error_page CODE URI; + location = URI { internal }),
# он корректно сохраняет статус 404 клиенту, в отличие от захода туда же через
# try_files-фолбэк внутри другого error_page (см. историю выше — вложенный
# error_page не перезапускается для ошибки внутри уже активного error_page,
# поэтому статус 404 туда так и не удавалось довести; в этой версии вложенности
# больше нет вообще, всё разложено на "либо путь реально есть — увидели и
# переписали выше, либо действительно 404 — сюда").
error_page 404 /404.html;
location = /404.html {
    internal;
}
