# Managed by hostme (`hostme <domain> config --nginx-snippet ...`).
# Дополнение к дефолтам hostme (src/hostme/data/nginx-defaults.conf) для
# генераторов статики: charset и кастомный 404. Политику URL (закрывающий
# слэш, /page.html -> /page/, отдача плоских page.html по /page/) задают
# дефолты — здесь её НЕ дублировать (до 0.5.0 этот файл делал обратное,
# /page/ -> /page, вместе с дефолтами это петля редиректов).
#
# У Webinoly нигде нет директивы charset — .html-страницы это переживают
# (там свой <meta charset="utf-8">), но у файлов без такой возможности
# (.txt, .json, .xml и т.п.) сервер не сообщает браузеру кодировку вообще,
# и UTF-8-байты с кириллицей рендерятся кракозябрами (поймано вживую
# 2026-09-09 на /llm.txt). Файл на диске в порядке, дело чисто в заголовке.
charset utf-8;

# Настоящий 404 (SEO: код ответа обязателен, не просто похожая страница).
# Стандартный паттерн nginx: error_page CODE URI + location = URI { internal }
# сохраняет статус 404 клиенту. Сюда попадаем, только когда ни файла, ни
# page.html нет — эти случаи дефолты разбирают раньше, на rewrite-фазе.
error_page 404 /404.html;
location = /404.html {
    internal;
}
