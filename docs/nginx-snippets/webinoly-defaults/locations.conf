# Webinoly (This configuration file is only for internal use)
#####################################################################################################
# Please, DO NOT MODIFY this file, all the changes will be lost.                                    #
# If you need to modify any of the existing rules, use the proper command as indicated in the docs. #
# If you need to add your own custom rules, you can create a custom file as indicated in the docs.  #
# Security settings can be customized on the Webinoly Configuration File.                           #
# Please, read the documentation: https://webinoly.com/documentation/                               #
#####################################################################################################


# Fallback robots.txt location (wp and proxy have higher priority if present)
location ~* ^/robots.txt$ {
	access_log off;
	log_not_found off;
}


# Security settings for better privacy
#######################################

# Deny hidden (dot) files except the "well-known" folder
location ^~ /.well-known/ {
	try_files $uri =404;
	limit_except GET {deny all;}
	disable_symlinks on;
	autoindex off;
}
location ~ /\. {
	deny all;
	access_log off;
	log_not_found off;
}

# Traversal attack protection
if ($query_string ~* "\.\./|\.\.\\|//|\\\\") {
	return 403;
}
location ~* (\.\./|\.\.\\|//|\\\\) {
	deny all;
	access_log off;
	log_not_found off;
}

# Deny/Block some extensions
location ~* ^.+\.(7z|ai|alfa|asc|asp|aspx|ba|backup|bak|bash|bat|bin|bkp|bz2|c|cco|cfg|cgi|class|com|conf|cpp|crt|cs|dat|db|dbf|deb|der|dll|dmg|dmp|dump|ear|env|eps|exe|git|gz|h|hg|hqx|img|ini|iso|jad|jar|jardiff|jnlp|jsp|kar|kml|kmz|log|m3u8|mdb|mml|msi|msm|msp|odp|ods|odt|old|orig|original|out|pdb|pem|phar|php#|php_bak|php~|pkg|pl|pm|ppk|prc|ps|py|rar|rdf|rpm|run|save|sea|sh|sit|sql|srv|suspected|svn|swo|swp|sys|tar|taz|tcl|tgz|tk|tmp|tpl|tsl|tz|vb|yml|war|wsf|xspf|z|zip)$ {
	deny all;
	access_log off;
	log_not_found off;
} #End

# Deny/Block for readme.(txt|html) or license.(txt|html) or example.(txt|html)
location ~*  "/(changelog|environment|example|install|installation|legalnotice|license|phpunit|readme|update|upgrade|wp-config)\.(txt|html|htm|md|xml)" {
	deny all;
	access_log off;
	log_not_found off;
} #End

# Deny/Block some files and folder (exact-match, case-sensitive)
location ~ (/node_modules/|composer.json|/fixtures/|/behat/) {
	deny all;
	access_log off;
	log_not_found off;
} #End


