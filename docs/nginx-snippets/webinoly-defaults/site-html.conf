# ПРИМЕР сгенерированного Webinoly server-блока для HTML-типа сайта
# (снято с /etc/nginx/sites-available/bolandau.ru, 2026-09-09). Только для
# справки — реальные файлы на сервере, руками не редактируются (см. auth.conf
# и другие в этой папке — все "DO NOT MODIFY").

# WebinolySSLredirectStart - HTTP to HTTPS Redirect
server {
	listen 80;
	listen [::]:80;
	server_name bolandau.ru *.bolandau.ru;
	return 301 https://$host$request_uri;
}
# WebinolySSLredirectEnd
# WebinolyWWWredirectStart - Force WWW or non-WWW redirect
server {
	listen 443 ssl;
	listen [::]:443 ssl;
	listen [::]:443 quic;
	listen 443 quic;
	server_name www.bolandau.ru;

	# WebinolySSLstart
	ssl_certificate /etc/letsencrypt/live/bolandau.ru/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/bolandau.ru/privkey.pem;
	# WebinolySSLend
	include common/headers-http.conf;
	include common/headers-https.conf;
	return 301 $scheme://bolandau.ru$request_uri;
}
# WebinolyWWWredirectEnd
# WebinolyNginxServerStart
server {
	listen 443 ssl;
	listen [::]:443 ssl;
	listen [::]:443 quic;
	listen 443 quic;

	server_name bolandau.ru;

	# WebinolySSLstart
	ssl_certificate /etc/letsencrypt/live/bolandau.ru/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/bolandau.ru/privkey.pem;
	# WebinolySSLend
	access_log off;
	error_log /var/log/nginx/bolandau.ru.error.log;

	root /var/www/bolandau.ru/htdocs;

	index index.html index.htm;
	location / { try_files $uri $uri/ =404; }

	include common/auth.conf;

	# WebinolyCustom
	# WebinolyCustomEnd

	include common/locations.conf;
	include common/headers.conf;
	include /var/www/bolandau.ru/*-nginx.conf;
	include /etc/nginx/conf.d/*.conf.srv;
}
# WebinolyNginxServerEnd
