# ПРИМЕР сгенерированного Webinoly server-блока для PHP-типа сайта
# (снято с /etc/nginx/sites-available/test.bolandau.ru, 2026-09-09). Только
# для справки — реальные файлы на сервере, руками не редактируются.
#
# Главное отличие от site-html.conf: include common/php.conf вместо
# инлайнового location / — см. php.conf в этой же папке (два location:
# основной и ~* \.php$). Из-за этого чистые URL ведут себя иначе, см.
# docs/nginx-snippets/README.md.

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	listen [::]:443 quic;
	listen 443 quic;

	server_name test.bolandau.ru;

	# WebinolySSLstart
	ssl_certificate /etc/letsencrypt/live/bolandau.ru/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/bolandau.ru/privkey.pem;
	# WebinolySSLend
	access_log off;
	error_log /var/log/nginx/test.bolandau.ru.error.log;

	root /var/www/test.bolandau.ru/htdocs;

	index index.php index.html index.htm;

	include common/auth.conf;

	# WebinolyCustom
	# WebinolyCustomEnd

	include common/php.conf;
	include common/locations.conf;
	include common/headers.conf;
	include /var/www/test.bolandau.ru/*-nginx.conf;
	include /etc/nginx/conf.d/*.conf.srv;
}
