[project]
name = "rb-hostme"
# Version comes from the git tag vX.Y.Z (uv-dynamic-versioning) — never add `version =`.
dynamic = ["version"]
description = "Deploy static sites and PHP to your own VPS: a personal surge.sh alike."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Roman Bolandau", email = "r.bolandau@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "rb-credentials>=0.7.1,<1",
    "keyring>=25.0.0",
    "packaging>=24.0",
    "platformdirs>=4.4",
    "rich>=15.0.0",
    "ruamel-yaml>=0.19.1",
    "typer>=0.27.2,<0.28",
]

[project.scripts]
hostme = "hostme.cli:main"

[project.urls]
Repository = "https://homeserver.tailee01ab.ts.net:3000/bolandeu/hostme"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
fallback-version = "0.0.0"

[tool.uv]
# Rebuild the editable install when a commit or tag moves, so `--version` follows the tag.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

# Our packages come only from the Gitea registry: a version range in
# `dependencies` ("rb-serp>=0.3") and a source line per package, never a git
# tag. explicit = true: only the packages named in [tool.uv.sources] are looked
# up there, and they are never taken from PyPI (an unrelated package of the
# same name may live there).
# [tool.uv.sources]
# rb-serp = { index = "gitea" }
[tool.hatch.build.targets.sdist]
# What a release must not carry: the agent's own files, the forge configs and the dev tooling. The wheel is
# narrow already (`packages = ["src/<pkg>"]`); this is about the sdist, which is otherwise a copy of the repo.
exclude = [
  "/.agents",
  "/.claude",
  "/.claude-plugin",
  "/.gitea",
  "/.github",
  "/docs",
  "/scripts",
  "/uv.lock",
  "/AGENTS.md",
  "/CLAUDE.md",
  "/CODING_STANDARDS.md",
  "/CONTEXT.md",
  "/.copier-answers.yml",
  "^\\.gitignore$",
  "/.gitleaks.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hostme"]

[tool.hatch.build.targets.wheel.force-include]
# Установленный CLI читает [[tool.rb.external]] отсюда (стандарт §12).
"pyproject.toml" = "hostme/_pyproject.toml"

[dependency-groups]
# Mutation testing, run now and then and before big releases — not in the gate:
# `uv run --group mutation mutmut run`, then `mutmut results` / `mutmut browse`.
# Needs fork(): macOS/Linux (WSL on Windows). Settings: [tool.mutmut] below.
mutation = ["mutmut>=3.3"]
dev = [
    "jsonschema>=4.23",
    "pytest>=9.1.1",
    "pyyaml>=6.0",  # .copier-answers.yml, the CI workflow, tests/contracts/*.yaml
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
    "syrupy>=4.8",
    "ty>=0.0.80",
]

# External (non-Python) dependencies — every CLI this tool runs (require_cli,
# shutil.which, subprocess with a literal program, npx). The gate checks this
# list against the code both ways; doctor and require_cli read it at runtime;
# the tools catalog reads it (the Standard, Technology).
[[tool.rb.external]]
name = "ssh"
required = true
check = "ssh -V"
why = "команды Webinoly на своих серверах, проверка доступа в auth status --check"

[[tool.rb.external]]
name = "rsync"
required = true
why = "заливка сайтов на свои серверы и на ssh-target'ы, бэкап target'а перед деплоем"

[[tool.rb.external]]
name = "lftp"
required = false
why = "заливка на ftp/sftp-target'ы (нужен, только если такие target'ы зарегистрированы)"

[[tool.rb.external]]
name = "sshpass"
required = false
check = "sshpass -V"
why = "ssh-target'ы с паролем вместо ключа (пароль через SSHPASS, не в argv)"

# Where sysadmin's tool-updater installs this tool after its first tag. The
# installation is sysadmin's; this section only says where. homeserver: users
# to install for (empty = build and publish only); mac: install on the Mac.
# extras (optional): the extras to install with, e.g. extras = ["browser"].
[tool.rb.install]
homeserver = ["rbtools"]
mac = true

[tool.cli-generator]
# Where scripts/check_command_docstrings.py (called by the project's checks)
# looks for commands: a glob or a list of globs, relative to the repo root.
commands = ["src/hostme/commands/*.py"]
# gate check (the gate): extras to install before ruff/ty/pytest.
# gate_extras = ["browser"]

[tool.pytest.ini_options]
# Only tests/: mutmut leaves a copy of the tree in mutants/.
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing:skip-covered"
# tests/test_help.py keeps help snapshots at tests/snapshots/help/<command>.txt
# (the Standard, Commands), not in syrupy's own `__snapshots__/<test file>/` layout, so
# syrupy warns it "can not relate" each file to its test. It can — by name.
filterwarnings = ["ignore:(?s).*Can not relate snapshot:UserWarning"]
markers = [
    "e2e: реальный сервер по SSH (HOSTME_E2E_HOST), по умолчанию пропускается",
]

[tool.mutmut]
source_paths = ["src/hostme"]
also_copy = ["scripts/", "pyproject.toml"]  # tests read them (test_scripts.py, the distribution checks)
pytest_add_cli_args = ["--no-cov"]  # fail_under would kill every mutant
# only_mutate = ["*/core/normalize.py"]  # one module at a time on a big tool

[tool.coverage.run]
source = ["src"]
# sysmon (default on 3.14) keeps a record per recompiled code object; Typer recompiles annotations on every invoke, so memory grows.
core = "ctrace"

[tool.coverage.report]
# Порог — по факту на момент рефакторинга на cli-builder-архитектуру.
# Поднимать по мере добавления тестов, никогда не опускать (новая команда
# без тестов должна падать именно здесь — это осознанный «пинок»).
fail_under = 65
show_missing = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF", "S", "BLE", "T20", "TID251"]
# RUF001-003 («похожие на латиницу» символы) — весь текст проекта на русском.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# assert — суть теста; тестовые пароли/subprocess в e2e — тоже намеренно; print в строках кода; httpx для моков
"tests/*" = ["S101", "S105", "S106", "S108", "S603", "S607", "T201", "TID251", "BLE001"]
"scripts/*" = ["S603", "S607", "T201"]  # subprocess with fixed argv lists (git, uv), no shell; scripts print to the console
# providers/ — весь смысл слоя в запуске ssh/rsync/lftp: argv-списком, без shell;
# бинарь ищется в PATH намеренно (уважаем окружение пользователя, кроссплатформенно)
"src/*/providers/*" = ["S603", "S607", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"httpx".msg = "Call external APIs through providers/ (subclass providers.HttpProvider)."

[tool.ruff.lint.flake8-bugbear]
# Typer's `param: T = typer.Option(...)` style is a call in a default on purpose.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ty.terminal]
# Only errors fail the gate; recent ty (>= 0.0.84) otherwise exits 1 on warnings too.
error-on-warning = false


[tool.uv.sources]
rb-credentials = { path = "../rb-credentials" }
