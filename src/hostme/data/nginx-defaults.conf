# Managed by hostme — дефолты каждого сайта на своём сервере (Webinoly).
# Перезаписывается при каждом деплое и `hostme server update` — не редактировать
# руками; своё — через `hostme <domain> config --nginx-snippet`.
# Лежит в /var/www/<domain>/*-nginx.conf: Webinoly подключает такие файлы в
# server{} сайта и не трогает их при `webinoly -update` (docs/usage/webinoly.md).
#
# Политика URL: у каждой страницы закрывающий слэш.
#   /a/index.html, /a.html -> 301 /a/      /a -> 301 /a/ (если есть a.html или a/)
#   /a/ отдаёт a/index.html, иначе a.html (генераторы с плоскими .html).
# Query string сохраняется во всех редиректах.
#
# Всё решается по $request_uri на уровне server{}: rewrite-фаза прогоняется
# заново на каждом внутреннем redirect, а $request_uri не меняется — правила
# идемпотентны. `if` внутрь location с try_files не переносить ("if is evil",
# см. docs/nginx-snippets/README.md).

if ($request_uri ~ ^(/[^?]*)) {
    set $hostme_path $1;
}

# /index.html -> /, /a/index.html -> /a/
if ($request_uri ~ ^(/(?:[^?]*/)?)index\.html(\?.*)?$) {
    return 301 $1$2;
}

# /a.html -> /a/. Кроме файлов, которые обязаны отвечать 200 по своему имени:
# 404.html и файлы подтверждения Google/Яндекса в корне.
if ($request_uri ~ ^/(?!(?:404|google[0-9a-f]+|yandex_[0-9a-f]+)\.html(?:\?|$))([^?]+)\.html(\?.*)?$) {
    return 301 /$1/$2;
}

# /a -> /a/, если страница — плоский a.html (директорию без слэша nginx
# редиректит сам через try_files $uri/ у Webinoly).
if (-f $document_root$hostme_path.html) {
    return 301 $hostme_path/$is_args$args;
}

# /a/ -> отдать a.html, если в a/ нет своего index.html. index.php не считаем:
# генераторы кладут в одноимённую директорию заглушку-редирект на /, и она
# перехватывала бы страницу (поймано на test.bolandau.ru 2026-09-09).
set $hostme_dir "";
if ($request_uri ~ ^(/[^?]+)/(?:\?.*)?$) {
    set $hostme_dir $1;
}
if (-f $document_root$hostme_dir/index.html) {
    set $hostme_dir "";
}
if (-f $document_root$hostme_dir.html) {
    rewrite ^ $hostme_dir.html last;
}

# Хешированные ассеты сборки (Astro): имя меняется с содержимым — кэш навсегда.
# Префиксная ^~ перебивает regex-location статики у Webinoly (там expires max
# без immutable); add_header в location отменяет унаследованные, поэтому
# заголовки безопасности Webinoly подключаем явно, как в его же location.
location ^~ /_astro/ {
    try_files $uri =404;
    include common/headers-http.conf;
    include common/headers-https.conf;
    add_header "Access-Control-Allow-Origin" "*";
    add_header "Cache-Control" "public, max-age=31536000, immutable";
    access_log off;
    log_not_found off;
}
