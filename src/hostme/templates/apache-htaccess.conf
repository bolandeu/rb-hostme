Options -Indexes
DirectoryIndex index.html

ErrorDocument 404 /404.html

# ── MIME-типы ─────────────────────────────────────────────────────────────────
<IfModule mod_mime.c>
  AddType image/webp                  .webp
  AddType image/svg+xml               .svg
  AddType application/manifest+json   .webmanifest
  AddType font/woff2                  .woff2
  AddType font/woff                   .woff
  AddType application/json            .json
</IfModule>

# ── Сжатие gzip ───────────────────────────────────────────────────────────────
<IfModule mod_deflate.c>
  AddOutputFilterByType DEFLATE text/html text/css application/javascript
  AddOutputFilterByType DEFLATE application/json application/xml text/xml
  AddOutputFilterByType DEFLATE image/svg+xml font/woff2 font/woff
</IfModule>

# ── Кеширование статических ресурсов ─────────────────────────────────────────
<IfModule mod_expires.c>
  ExpiresActive On
  # Изображения — 1 год
  ExpiresByType image/jpeg              "access plus 1 year"
  ExpiresByType image/png               "access plus 1 year"
  ExpiresByType image/webp              "access plus 1 year"
  ExpiresByType image/gif               "access plus 1 year"
  ExpiresByType image/svg+xml           "access plus 1 year"
  ExpiresByType image/x-icon            "access plus 1 year"
  # Шрифты — 1 год
  ExpiresByType font/woff2              "access plus 1 year"
  ExpiresByType font/woff               "access plus 1 year"
  ExpiresByType application/font-woff   "access plus 1 year"
  # CSS и JS — 1 месяц (не immutable, может обновляться)
  ExpiresByType text/css                "access plus 1 month"
  ExpiresByType application/javascript  "access plus 1 month"
  # HTML — не кешировать
  ExpiresByType text/html               "access plus 0 seconds"
  # JSON, XML, txt — 1 день
  ExpiresByType application/json        "access plus 1 day"
  ExpiresByType application/xml         "access plus 1 day"
  ExpiresByType text/xml                "access plus 1 day"
  ExpiresByType text/plain              "access plus 1 day"
</IfModule>

<IfModule mod_headers.c>
  # Cache-Control для статики с долгим сроком
  <FilesMatch "\.(webp|jpg|jpeg|png|gif|svg|ico|woff2|woff)$">
    Header set Cache-Control "public, max-age=31536000, immutable"
  </FilesMatch>
  # CSS/JS — кеш на месяц, требует ревалидации
  <FilesMatch "\.(css|js)$">
    Header set Cache-Control "public, max-age=2592000, must-revalidate"
  </FilesMatch>
  # HTML — не кешировать
  <FilesMatch "\.html$">
    Header set Cache-Control "no-cache, must-revalidate"
  </FilesMatch>
  # Безопасность
  Header always set X-Content-Type-Options "nosniff"
  Header always set X-Frame-Options "SAMEORIGIN"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
</IfModule>

# ── Rewrite-правила ───────────────────────────────────────────────────────────
RewriteEngine On

# /index.html -> /
RewriteCond %{THE_REQUEST} \s/+index\.html[\s?] [NC]
RewriteRule ^index\.html$ / [R=301,L]

# /page.html -> /page  (works for all paths including /blog/slug.html, /blog/c-tag.html)
RewriteCond %{THE_REQUEST} \s/+(.+?)\.html[\s?] [NC]
RewriteRule ^(.+)\.html$ /$1 [R=301,L]

# /page/ -> /page
RewriteCond %{REQUEST_URI} !^/$
RewriteCond %{REQUEST_URI} .+/$
RewriteRule ^(.+)/$ /$1 [R=301,L]

# Existing files and directories, including blog/assets/, css/, js/, data/, og/.
RewriteCond %{REQUEST_FILENAME} -f [OR]
RewriteCond %{REQUEST_FILENAME} -d
RewriteRule ^ - [L]

# Clean URL → .html  (handles /blog, /blog/slug, /blog/c-tag, /blog.html etc.)
RewriteCond %{REQUEST_FILENAME}.html -f
RewriteRule ^(.+)$ $1.html [L]

# Everything else is a real 404.
RewriteRule ^ - [R=404,L]
